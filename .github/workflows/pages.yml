# Publishes the public site (petition/public) to GitHub Pages.
# The static copy has no signature server: signing hands the signer a record
# addressed to the coalition email. The full backend runs on the Docker deploy.
name: publish site
on:
  push:
    branches: [main, claude/indiana-ltc-workers-petition-tlrzju]
    paths: ["petition/public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: petition/public
      - id: deployment
        uses: actions/deploy-pages@v4
