name: petition tests
on:
  push:
    paths: ["petition/**", ".github/workflows/petition-test.yml"]
  pull_request:
    paths: ["petition/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petition/package-lock.json
      - run: npm ci
      - run: npm test
